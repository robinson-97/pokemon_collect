<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Collectie</title>
  <link rel="stylesheet" href="src/style.css?v=14">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><span class="full">Pokémon </span>Collectie</a>
    <div class="topbar-actions">
      <div class="seg" id="src" role="group" aria-label="Prijsbron">
        <button data-s="cm">Cardmarket</button>
        <button data-s="tcg">TCGplayer</button>
      </div>
      <button id="btn-add" class="btn primary" aria-label="Set toevoegen">+ Set</button>
    </div>
  </header>
  <main id="app"></main>
  <footer class="foot"><button id="btn-backup" class="linkbtn">Back-up</button> · <span>versie 14</span></footer>

  <dialog id="dlg-add">
    <form method="dialog" class="dlg-head">
      <h2>Kies de sets die je spaart</h2>
      <button class="btn ghost" aria-label="Sluiten">✕</button>
    </form>
    <input id="set-search" type="search" placeholder="Zoek op naam of serie…" autocomplete="off">
    <div id="year-chips" class="year-chips" role="group" aria-label="Filter op jaar"></div>
    <div id="set-list" class="set-list"></div>
  </dialog>

  <dialog id="dlg-card" class="lightbox">
    <div id="card-detail"></div>
  </dialog>

  <dialog id="dlg-backup">
    <form method="dialog" class="dlg-head">
      <h2>Back-up</h2>
      <button class="btn ghost" aria-label="Sluiten">✕</button>
    </form>
    <p>Je gegevens staan alleen in deze browser. Maak af en toe een back-up.</p>
    <div class="row">
      <button id="btn-export" class="btn primary">Downloaden</button>
      <label class="btn">Terugzetten<input id="file-import" type="file" accept="application/json" hidden></label>
    </div>
  </dialog>

  <dialog id="dlg-scan" class="scan">
    <div class="dlg-head"><h2>Kaart scannen</h2><button id="scan-close" class="btn ghost" aria-label="Sluiten">✕</button></div>
    <div id="scan-view" class="scan-view" hidden>
      <video id="scan-video" playsinline muted autoplay></video>
      <div id="scan-guide" class="scan-guide"></div>
    </div>
    <p id="scan-status" class="muted small" role="status">Camera starten…</p>
    <button id="scan-go" class="btn primary big" hidden>Scan kaart</button>
    <form id="scan-form" class="scan-form">
      <input id="scan-input" type="search" placeholder="Of typ nummer (25/165) of naam" autocomplete="off">
      <button class="btn">Zoek</button>
    </form>
    <div id="scan-results"></div>
  </dialog>

  <button id="btn-scan" class="fab" aria-label="Kaart scannen">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <span>Scan</span>
  </button>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="src/app.js?v=14"></script>
</body>
</html>
